<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products — PrintFlow</title>
  <link rel="icon" href="/images/printflow-logo.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body data-shell="customer" data-page="products" class="bg-surface text-on-surface min-h-screen flex flex-col">
  <main class="flex-1">
    <div id="page-header"></div>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-10">
      <div class="flex flex-col md:flex-row gap-4 md:items-center justify-between mb-8">
        <div class="relative md:w-96">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
          <input id="search" type="search" class="field pl-10" placeholder="Search visiting cards, flyers, banners…" aria-label="Search products" />
        </div>
        <div id="filters" class="flex gap-2 overflow-x-auto pb-1" role="tablist" aria-label="Product categories"></div>
      </div>
      <div id="grid" class="grid gap-4 sm:gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
      <p id="empty" class="hidden text-center text-body-lg text-on-surface-variant py-16">No products match your search.</p>
      <p class="mt-10 text-body-sm text-on-surface-variant">Prices shown are estimates for the smallest quantity, including GST, using demo rates. The press confirms the final quote after reviewing your order.</p>
    </div>
  </main>
  <script type="module" src="/src/js/pages/products.js"></script>
</body>
</html>
