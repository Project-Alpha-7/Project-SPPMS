<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delivery &amp; payment — PrintFlow</title>
  <link rel="icon" href="/images/printflow-logo.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body data-shell="customer" data-page="products" class="bg-surface text-on-surface min-h-screen flex flex-col">
  <main class="flex-1">
    <div class="border-b border-outline-variant bg-surface-container-lowest">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4" id="steps"></div>
    </div>
    <form id="checkout" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 gap-8 lg:grid-cols-[minmax(0,1fr),400px] items-start" novalidate>
      <div class="space-y-6">
        <h1 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl">Delivery &amp; payment</h1>

        <section class="card p-5 md:p-6">
          <h2 class="font-title-md text-title-md mb-4">Your details</h2>
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2"><label class="field-label" for="name">Full name *</label><input id="name" name="name" class="field" autocomplete="name" required /></div>
            <div><label class="field-label" for="phone">Phone *</label><input id="phone" name="phone" type="tel" class="field" autocomplete="tel" placeholder="+91" required /></div>
            <div><label class="field-label" for="email">Email *</label><input id="email" name="email" type="email" class="field" autocomplete="email" required /></div>
          </div>
        </section>

        <section class="card p-5 md:p-6">
          <h2 class="font-title-md text-title-md mb-4">Delivery or pickup</h2>
          <div class="grid sm:grid-cols-2 gap-3" role="radiogroup">
            <label class="flex gap-3 p-4 rounded-lg border-[1.5px] border-outline-variant cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
              <input type="radio" name="method" value="pickup" class="mt-1 accent-[rgb(var(--c-primary))]" checked />
              <span><span class="font-bold block">Pickup at the press</span><span class="text-body-sm text-on-surface-variant">Free. We'll notify you when it's ready.</span></span>
            </label>
            <label class="flex gap-3 p-4 rounded-lg border-[1.5px] border-outline-variant cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
              <input type="radio" name="method" value="delivery" class="mt-1 accent-[rgb(var(--c-primary))]" />
              <span><span class="font-bold block">Delivery</span><span class="text-body-sm text-on-surface-variant">Flat ₹80 within the city (demo rate).</span></span>
            </label>
          </div>
          <div id="address-fields" class="hidden grid sm:grid-cols-3 gap-4 mt-4">
            <div class="sm:col-span-2"><label class="field-label" for="address">Address *</label><input id="address" name="address" class="field" autocomplete="street-address" /></div>
            <div><label class="field-label" for="pin">PIN code *</label><input id="pin" name="pin" class="field" inputmode="numeric" maxlength="6" autocomplete="postal-code" /></div>
          </div>
          <div class="grid sm:grid-cols-2 gap-4 mt-4">
            <div><label class="field-label" for="date">Preferred date</label><input id="date" name="date" type="date" class="field" /><p class="text-body-sm text-on-surface-variant mt-1">A request, not a guaranteed date.</p></div>
            <div><label class="field-label" for="dnotes">Notes</label><input id="dnotes" name="dnotes" class="field" maxlength="200" placeholder="Landmark, timing…" /></div>
          </div>
        </section>

        <section class="card p-5 md:p-6">
          <h2 class="font-title-md text-title-md mb-4">Payment</h2>
          <div class="space-y-3">
            <label class="flex gap-3 p-4 rounded-lg border-[1.5px] border-outline-variant cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
              <input type="radio" name="payment" value="pickup" class="mt-1" checked />
              <span><span class="font-bold block">Pay at pickup / on delivery</span><span class="text-body-sm text-on-surface-variant">Pay the confirmed amount when you collect your order.</span></span>
            </label>
            <label class="flex gap-3 p-4 rounded-lg border-[1.5px] border-outline-variant cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
              <input type="radio" name="payment" value="advance" class="mt-1" />
              <span><span class="font-bold block">Advance payment</span><span class="text-body-sm text-on-surface-variant">Pay by UPI or bank transfer after the press confirms your quote. The press verifies it manually.</span></span>
            </label>
            <label class="flex gap-3 p-4 rounded-lg border-[1.5px] border-outline-variant cursor-pointer has-[:checked]:border-primary has-[:checked]:bg-primary/5">
              <input type="radio" name="payment" value="online" class="mt-1" />
              <span><span class="font-bold block flex items-center gap-2">Online payment <span class="demo-flag">Demo mode</span></span><span class="text-body-sm text-on-surface-variant">No real charge. A payment gateway is not connected yet.</span></span>
            </label>
          </div>
        </section>

        <label class="flex gap-3 text-body-md">
          <input id="agree" type="checkbox" class="mt-1" required />
          <span>I agree to the <a href="/legal.html#terms" class="text-primary underline" target="_blank">terms</a> and <a href="/legal.html#privacy" class="text-primary underline" target="_blank">privacy notice</a>, and confirm I have the rights to print this artwork.</span>
        </label>
        <p id="form-error" class="field-error hidden" role="alert"></p>
      </div>

      <aside class="lg:sticky lg:top-32 card overflow-hidden">
        <div class="cmyk-strip"><span></span><span></span><span></span><span></span></div>
        <div class="p-5 space-y-4">
          <div class="flex items-center justify-between"><h2 class="font-title-md text-title-md">Order summary</h2><span class="chip chip-warn">Estimate</span></div>
          <div id="spec" class="text-body-md"></div>
          <div id="files" class="text-body-sm text-on-surface-variant"></div>
          <div id="breakdown"></div>
          <p class="text-body-sm text-on-surface-variant">Final quote confirmed by the press after review.</p>
          <button type="submit" id="submit" class="btn btn-primary w-full py-3 text-body-lg">Submit order<span class="material-symbols-outlined">send</span></button>
          <a href="/upload.html" class="btn btn-outline w-full"><span class="material-symbols-outlined">arrow_back</span>Back to artwork</a>
        </div>
      </aside>
    </form>
  </main>
  <script type="module" src="/src/js/pages/checkout.js"></script>
</body>
</html>
