<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track your order — PrintFlow</title>
  <link rel="icon" href="/images/printflow-logo.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body data-shell="customer" data-page="track" class="bg-surface text-on-surface min-h-screen flex flex-col">
  <main class="flex-1">
    <div id="page-header"></div>
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
      <form id="lookup" class="card p-4 sm:p-5 flex flex-col sm:flex-row gap-3 sm:items-end">
        <div class="flex-1"><label class="field-label" for="oid">Order ID</label><input id="oid" class="field uppercase" placeholder="SP-2026-XXXXX" autocomplete="off" required /></div>
        <button class="btn btn-primary py-2.5"><span class="material-symbols-outlined">search</span>Track</button>
      </form>
      <p id="notfound" class="hidden card p-5 text-body-md border-error text-error" role="alert"></p>
      <div id="result"></div>
      <p class="text-body-sm text-on-surface-variant">For your privacy, this page shows order progress only. Contact details, addresses and payment references are never shown here.</p>
    </div>
  </main>
  <script type="module" src="/src/js/pages/track.js"></script>
</body>
</html>
